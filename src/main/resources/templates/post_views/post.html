<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="/fragments/head :: head"></head>

<body class="sub_page">

  <div class="hero_area">
    <div class="bg-box">
      <img th:src="@{/images/hero-bg.jpg}" alt="">
    </div>
<header th:replace="/fragments/header :: header"></header>
  </div>



  <section class="about_section layout_padding">
    <div class="container  ">
      <div class="posts">
        <h3><a th:text="${post.title}">Title</a></h3>
        <h5 th:text="'Author ' + ${post.account.firstname} + ' | Created at: ' + ${#temporals.format(post.createdAt, 'yyyy-MM-dd HH:mm')}"></h5>
        <p th:utext="${post.body}">Empty</p>
        <div sec:authorize = "isAuthenticated()" th:if="${isOwner}">
          <a th:href="@{'/post/' + ${post.id} + '/edit' }" class="btn btn-secondary btn-lg active" role="button" aria-pressed="true">Edit</a>
        </div>
        <div class="my-2" sec:authorize="isAuthenticated()" th:if="${isOwner}">
          <form th:action="@{'/post/' + ${post.id} + '/delete'}" method="post">
            <input type="hidden" name="_method" value="delete"/>
            <button type="submit" class="btn btn-danger btn-lg">Delete</button>
          </form>
        </div>
      </div>
    </div>
  </section>

<footer th:replace="/fragments/footer :: footer"></footer>

</body>

</html>
