<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="/fragments/head :: head"></head>

<body class="sub_page">

  <div class="hero_area">
    <div class="bg-box">
      <img src="images/hero-bg.jpg" alt="">
    </div>
<header th:replace="/fragments/header :: header"></header>
  </div>

  <section class="about_section layout_padding">
    <div class="container  ">
 		<h2>Login</h2>
    <p th:if="${message}" th:text="${message}" class="alert alert-success" role="alert"></p>
    <form th:action="@{/login}" method="post">
  <div class="form-group">
    <label for="email">Email:</label>
    <input type="email" name="username" class="form-control" required>
  </div>

  <div class="form-group">
    <label for="password">Password:</label>
    <input type="password" name="password" class="form-control" required>
  </div>
  <div class="form-check">
    <input class="form-check-input" type="checkbox" value="remember-me" name="remember-me" >
    <label for="remember-me" class="form-check-labek">Remember me |</label>
    <a th:href="@{/forgot-password}" class="link-secondary">Forgot password</a>
  </div>

  <button type="submit" class="btn btn-primary">Login</button>
</form>

    </div>
  </section>

<footer th:replace="/fragments/footer :: footer"></footer>

</body>

</html>
