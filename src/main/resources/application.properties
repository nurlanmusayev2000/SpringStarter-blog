spring.application.name=SpringStarter
server.port = 8080

# ===============================
# = H2 Database Configuration =
# ===============================

# JDBC URL for H2 (in-memory)
spring.datasource.url=jdbc:h2:file:./db/blogdb

# JDBC Driver
spring.datasource.driver-class-name=org.h2.Driver

# DB credentials (optional for in-memory)
spring.datasource.username=admin
spring.datasource.password=password

# Hibernate dialect for H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically create/update tables
spring.jpa.hibernate.ddl-auto=create-drop

# Enable H2 console in browser
spring.h2.console.enabled=true
spring.h2.console.path=/db-console
spring.h2.console.settings.web-allow-others=false
# Show SQL queries in logs
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true
spring.mvc.hiddenmethod.filter.enabled=true


password.token.reset.timeout.minutes = 600